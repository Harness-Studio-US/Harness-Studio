name: Sync site source

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and verify source
        env:
          SOURCE_URL: https://site-d219f67dd7394859a5770eea41cc4020.freebuff.page/source.tar.gz
          SOURCE_SHA: d3a81e9c5813821dcff9f54be329f510b17892ae192ffaf157407c921d6e37cc
        run: |
          set -euo pipefail
          curl -fsSL "$SOURCE_URL" -o /tmp/source.tar.gz
          echo "$SOURCE_SHA  /tmp/source.tar.gz" | sha256sum -c -
          rm -rf /tmp/source-tree
          mkdir -p /tmp/source-tree
          tar -xzf /tmp/source.tar.gz -C /tmp/source-tree
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/workflows/sync-source.yml' \
            /tmp/source-tree/ ./

      - name: Commit source
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/sync-source.yml
          git add -A
          git commit -m "Add Firebase Authentication login and update privacy policy"
          git push origin HEAD:main
