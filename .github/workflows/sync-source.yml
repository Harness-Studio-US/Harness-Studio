name: Sync site source

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download updated source
        run: |
          set -euo pipefail
          curl -fsSL "https://site-d219f67dd7394859a5770eea41cc4020.freebuff.page/source.tar.gz" -o /tmp/harness-source.tar.gz
          tar -xzf /tmp/harness-source.tar.gz -C .

      - name: Commit updated site
        run: |
          set -euo pipefail
          rm -f .github/workflows/sync-source.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Source is already up to date."
            exit 0
          fi
          git commit -m "Refresh the site around the Harness Studio AI"
          git push origin HEAD:main
