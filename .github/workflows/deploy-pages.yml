name: Deploy GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare site source
        run: |
          set -euo pipefail
          mkdir -p app
          tar \
            --exclude=.git \
            --exclude=.source \
            --exclude=app \
            --exclude=dist-gh-pages \
            -cf - . | tar -xf - -C app

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: app
        run: bun install --frozen-lockfile

      - name: Validate Firebase configuration
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
        run: |
          set -euo pipefail
          missing=0
          for name in VITE_FIREBASE_API_KEY VITE_FIREBASE_AUTH_DOMAIN VITE_FIREBASE_PROJECT_ID VITE_FIREBASE_STORAGE_BUCKET VITE_FIREBASE_MESSAGING_SENDER_ID VITE_FIREBASE_APP_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not configured in repository Actions secrets."
              missing=1
            fi
          done
          test "$missing" -eq 0

      - name: Build
        working-directory: app
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          # Harness Code runs on your own machine, so the address is not in the
          # repository. Set the repository variable VITE_AI_ENDPOINT
          # (Settings -> Secrets and variables -> Actions -> Variables) to the
          # HTTPS address of the tunnel in front of Ollama, ending in /v1.
          # While that variable is unset the site builds the scripted demo.
          VITE_AI_ENDPOINT: ${{ vars.VITE_AI_ENDPOINT }}
          VITE_AI_MODEL: ${{ vars.VITE_AI_ENDPOINT != '' && 'harness-code' || '' }}
          VITE_AI_NO_THINK: ${{ vars.VITE_AI_ENDPOINT != '' && '1' || '' }}
        run: bun run build:pages

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist-gh-pages

      - name: Remove staging directory from git
        continue-on-error: true
        run: |
          set -euo pipefail
          if git ls-files app | grep -q .; then
            git rm -r --cached app
            grep -qxF 'app/' .gitignore || printf '\napp/\n' >> .gitignore
            git add .gitignore
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Remove Pages staging directory [skip ci]"
            git push origin HEAD:main
          fi

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
