name: Deploy GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare site source
        run: |
          set -euo pipefail
          mkdir -p app
          if [ -f src/pages/Landing.tsx ]; then
            tar \
              --exclude=.git \
              --exclude=.source \
              --exclude=source.tar.gz \
              --exclude=app \
              --exclude=dist-gh-pages \
              -cf - . | tar -xf - -C app
          else
            curl -fsSL "https://site-d219f67dd7394859a5770eea41cc4020.freebuff.page/source.tar.gz" -o source.tar.gz
            tar -xzf source.tar.gz -C app
          fi

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: app
        run: bun install --frozen-lockfile

      - name: Build
        working-directory: app
        run: bun run build:pages

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist-gh-pages

      - name: Materialize source for future builds
        continue-on-error: true
        run: |
          set -euo pipefail
          if [ -f src/pages/Landing.tsx ]; then
            echo "Source already materialized"
            exit 0
          fi
          tar \
            --exclude=node_modules \
            --exclude=dist-gh-pages \
            --exclude=.git \
            -cf - -C app . | tar -xf - -C .
          rm -rf .source source.tar.gz
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "Add site source [skip ci]"
          git push origin HEAD:main

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
