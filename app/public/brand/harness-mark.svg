<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none" role="img" aria-label="Harness Studio monogram">
  <defs>
    <linearGradient id="hsLeft" x1="68" y1="42" x2="68" y2="214" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4FD8FF" />
      <stop offset="0.45" stop-color="#1D7CF5" />
      <stop offset="1" stop-color="#1E3ECB" />
    </linearGradient>
    <linearGradient id="hsRight" x1="188" y1="42" x2="188" y2="214" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6B21D8" />
      <stop offset="0.55" stop-color="#8B2BE8" />
      <stop offset="1" stop-color="#D21BE0" />
    </linearGradient>
    <linearGradient id="hsRibbon" x1="42" y1="196" x2="226" y2="116" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38CFFF" />
      <stop offset="0.4" stop-color="#2E8DFB" />
      <stop offset="0.72" stop-color="#6D5BFF" />
      <stop offset="1" stop-color="#C04BFF" />
    </linearGradient>
    <linearGradient id="hsCurl" x1="150" y1="150" x2="222" y2="220" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7A3BFF" />
      <stop offset="1" stop-color="#B01AE8" />
    </linearGradient>
    <linearGradient id="hsShine" x1="60" y1="180" x2="196" y2="120" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0.55" />
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- vertical bars -->
  <rect x="36" y="42" width="64" height="172" rx="16" fill="url(#hsLeft)" />
  <rect x="156" y="42" width="64" height="172" rx="16" fill="url(#hsRight)" />

  <!-- folded ribbon forming the H crossbar -->
  <path
    d="M211 121c17 27 1 68-38 84-15 6-30 6-42-2"
    stroke="url(#hsCurl)"
    stroke-width="26"
    stroke-linecap="round"
    fill="none"
  />
  <path
    d="M49 191c38-17 64-45 98-70 26-19 53-17 69 5"
    stroke="url(#hsRibbon)"
    stroke-width="32"
    stroke-linecap="round"
    fill="none"
  />
  <!-- ribbon highlight -->
  <path
    d="M62 181c32-15 56-38 84-59 22-16 45-18 62-4"
    stroke="url(#hsShine)"
    stroke-width="3"
    stroke-linecap="round"
    fill="none"
    opacity="0.7"
  />
</svg>
